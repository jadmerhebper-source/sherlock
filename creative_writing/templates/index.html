<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designitive - Premium Lifestyle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background-color: #f7f3ee;
            color: #2f2a24;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 48px 60px;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 64px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 15px;
            color: #3d372f;
        }

        .nav-links span {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-links span:hover {
            color: #b26b4c;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(47, 42, 36, 0.2);
            display: grid;
            place-items: center;
            font-size: 14px;
            color: #2f2a24;
        }

        .about-btn {
            border: 1.5px solid #b26b4c;
            color: #b26b4c;
            padding: 8px 18px;
            font-size: 14px;
            text-transform: capitalize;
            border-radius: 4px;
        }

        .hero {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 48px;
            align-items: center;
        }

        .hero-content {
            max-width: 480px;
        }

        .eyebrow {
            font-size: 14px;
            letter-spacing: 0.4px;
            text-transform: capitalize;
            color: #5e5449;
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 54px;
            line-height: 1.1;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .hero-copy {
            font-size: 16px;
            line-height: 1.7;
            color: #5e5449;
            margin-bottom: 28px;
        }

        .cta-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 48px;
        }

        .cta-primary {
            background-color: #b45f3b;
            color: #fff;
            padding: 12px 28px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .cta-secondary {
            width: 42px;
            height: 42px;
            border: 1px solid #c6b8a6;
            border-radius: 4px;
            display: grid;
            place-items: center;
            color: #b26b4c;
            font-size: 18px;
        }

        .socials {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .socials span {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid rgba(47, 42, 36, 0.25);
            display: grid;
            place-items: center;
            font-size: 12px;
            color: #2f2a24;
        }

        .hero-image {
            background-color: #e2d7cb;
            padding: 18px;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
            object-fit: cover;
        }

        @media (max-width: 900px) {
            .nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .hero {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 42px;
            }

            .page {
                padding: 24px 24px 48px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <nav class="nav">
            <div class="logo">designitive</div>
            <div class="nav-links">
                <span>Exerunces</span>
                <span>Rellous</span>
                <span>Legunity offers ▾</span>
            </div>
            <div class="nav-right">
                <div class="icon">⌕</div>
                <div class="icon">✦</div>
                <div class="icon">⟳</div>
                <a class="about-btn" href="#">About</a>
            </div>
        </nav>

        <section class="hero">
            <div class="hero-content">
                <div class="eyebrow">High quality. dompmereare plogerly</div>
                <h1>Premium Lifestyle for expeifel</h1>
                <p class="hero-copy">
                    Eligq anvmatis siglt luaily rotels craund entimance from
                    ftey peportmance: for mittens user interactions.
                </p>
                <div class="cta-row">
                    <a class="cta-primary" href="#">Shign now</a>
                    <a class="cta-secondary" href="#">→</a>
                </div>
                <div class="socials">
                    <span>◎</span>
                    <span>✈</span>
                    <span>✚</span>
                    <span>◌</span>
                </div>
            </div>
            <div class="hero-image">
                <img
                    src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80"
                    alt="Model in black dress"
                >
            </div>
        </section>
    </div>
</body>
</html>
