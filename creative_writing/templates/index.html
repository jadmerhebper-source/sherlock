<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Storyteller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .upload-section {
            margin-bottom: 20px;
            border: 2px dashed #cbd5e0;
            padding: 40px;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        .upload-section:hover {
            border-color: #4a90e2;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            border: 1px solid #ccc;
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #e2e8f0;
            border-radius: 5px;
            font-weight: bold;
        }
        button#generate-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button#generate-btn:hover {
            background-color: #357abd;
        }
        button#generate-btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        #result-section {
            display: none;
            margin-top: 30px;
            text-align: left;
        }
        .result-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .mood-tag {
            background-color: #edf2f7;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #718096;
            margin-bottom: 10px;
            display: inline-block;
        }
        .story-text {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 20px;
            background-color: #fff8e1;
            border-left: 4px solid #f6e05e;
            border-radius: 4px;
        }
        .audio-controls {
            text-align: center;
            margin-top: 20px;
        }
        button#read-aloud-btn {
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button#read-aloud-btn:hover {
            background-color: #38a169;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Visual Storyteller ✨</h1>
        <p>Upload an image and let AI analyze the mood and ghostwrite a story opening for you.</p>

        <div class="upload-section">
            <form id="upload-form">
                <label for="file-upload" class="custom-file-upload">
                    📁 Choose Image
                </label>
                <input id="file-upload" type="file" name="image" accept="image/*" required onchange="updateFileName()">
                <div id="file-name" style="margin-top: 10px; color: #666;">No file chosen</div>
                <br>
                <button type="submit" id="generate-btn">Generate Story</button>
            </form>
        </div>

        <div class="loader" id="loader"></div>

        <div id="result-section">
            <img id="result-img" class="result-image" src="" alt="Uploaded Image">
            <div style="text-align: center;">
                <span id="mood-display" class="mood-tag">Mood: Unknown</span>
            </div>
            <div class="story-text" id="story-display">
                <!-- Story goes here -->
            </div>
            <div class="audio-controls">
                <button id="read-aloud-btn" onclick="playAudio()">
                    🔊 Read Aloud
                </button>
                <audio id="story-audio" style="display:none;"></audio>
            </div>
        </div>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('file-upload');
            const fileNameDisplay = document.getElementById('file-name');
            if (input.files && input.files.length > 0) {
                fileNameDisplay.textContent = input.files[0].name;
            } else {
                fileNameDisplay.textContent = "No file chosen";
            }
        }

        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('result-section');
            const generateBtn = document.getElementById('generate-btn');

            loader.style.display = 'block';
            resultSection.style.display = 'none';
            generateBtn.disabled = true;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();

                // Update UI
                document.getElementById('result-img').src = data.image_url;
                document.getElementById('mood-display').textContent = 'Mood: ' + data.mood;
                document.getElementById('story-display').textContent = data.story;
                document.getElementById('story-audio').src = data.audio_url;

                resultSection.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while processing the image.');
            } finally {
                loader.style.display = 'none';
                generateBtn.disabled = false;
            }
        });

        function playAudio() {
            const audio = document.getElementById('story-audio');
            audio.play();
        }
    </script>
</body>
</html>
